name: Source checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check Python syntax and source-only contents
        run: |
          python -m compileall -q 3ds/tools remix/tools
          python - <<'PY'
          import pathlib, subprocess
          forbidden = {'.cia', '.cxi', '.3dsx', '.elf', '.z64', '.n64', '.v64', '.rom', '.srm', '.pak', '.bin', '.wav', '.png', '.jpg', '.log', '.csv', '.exe', '.dll', '.zip'}
          for entry in subprocess.check_output(['git', 'ls-files', '--stage', '3ds', 'remix'], text=True).splitlines():
              info, name = entry.split('\t', 1)
              if info.startswith('160000 '): continue
              p = pathlib.Path(name)
              assert p.suffix.lower() not in forbidden, name
              assert p.name != 'build-config.json', name
              assert p.stat().st_size < 256 * 1024, name
          PY
      - name: Test expanded native asset loader without game assets
        run: python remix/tools/test_asset_loader.py --compiler g++
      - name: Test shared relocation import rules without game assets
        run: |
          python -m unittest discover -s remix/tools -p test_relocation_layout.py
          python -m unittest discover -s remix/tools -p test_extract_reference_assets.py
      - name: Test motion and audio conversion without game assets
        run: |
          python remix/tools/native_fighter_catalog.py --check
          python remix/tools/test_fighter_import.py
          python -m unittest discover -s remix/tools -p test_native_stage_tables.py
